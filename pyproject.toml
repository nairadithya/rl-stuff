[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grpo-small-lm"
version = "0.1.0"
description = "Training environment for small language models with GRPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.2.1",
    "datasets>=3.2.0",
    "peft>=0.14.0",
    "torch>=2.0.0",
    "transformers>=4.46.0",
    "trl>=0.12.1",
    "pyyaml>=6.0.2",
    "math-verify>=0.9.0",
    "tqdm>=4.67.0",
    "streamlit>=1.44.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0"]

[project.scripts]
grpo-train = "train_grpo:main"
grpo-eval = "eval_grpo:main"
grpo-prelim = "run_prelim:main"
grpo-compare = "compare_runs:main"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
