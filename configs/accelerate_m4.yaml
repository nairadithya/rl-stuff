# Accelerate configuration for M4 MacBook Air (16GB RAM)
# Run: accelerate launch --config_file configs/accelerate_m4.yaml train_grpo.py --config configs/grpo_m4_macbook.yaml

compute_environment: LOCAL_MACHINE
distributed_type: 'NO'  # Single device (MPS)
downcast_bf16: 'no'
machine_rank: 0
main_training_function: main
mixed_precision: bf16  # M4 has hardware BF16 acceleration
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
