models:
  - Qwen/Qwen2.5-0.5B-Instruct
  - google/gemma-3-1b-it

dataset_name: trl-lib/DeepMath-103K
train_split: train
test_split: test
train_max_samples: 500
test_max_samples: 200
max_steps: 100
learning_rate: 1.0e-6
reward_type: accuracy_format
max_completion_length: 512
eval_max_new_tokens: 512
temperature: 0.7
top_p: 0.95
repetition_penalty: 1.05
mask_truncated_completions: true
num_generations: 4
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
beta: 0.01
num_train_epochs: 1.0
loss_types:
  - grpo
  - dapo

output_root: outputs/sweep_pre
train_config: configs/grpo_modal.yaml
eval_config: configs/eval_prelim.yaml
eval_backend: transformers
run_name_prefix: presweep
seed: 42
use_accelerate: true
parallel: false
