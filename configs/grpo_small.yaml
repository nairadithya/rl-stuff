model_name: Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/DeepMath-103K
dataset_split: train
max_samples: 5000
output_dir: outputs/grpo-qwen2.5-0.5b
run_name: grpo-small-lm
seed: 42

num_train_epochs: 1.0
max_steps: 300
learning_rate: 1.0e-6
warmup_steps: 9

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_generations: 8

max_completion_length: 256

beta: 0.0
scale_rewards: group
loss_type: dapo
reward_type: accuracy

use_vllm: false
gradient_checkpointing: true
bf16: false
fp16: false
report_to: none
log_completions: true

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj
