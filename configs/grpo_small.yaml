model_name: Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/DeepMath-103K
dataset_split: train
max_samples: 200
output_dir: outputs/grpo-qwen2.5-0.5b
run_name: grpo-small-lm
seed: 42

num_train_epochs: 1.0
max_steps: 20
learning_rate: 1.0e-6
warmup_steps: 9

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 1

max_completion_length: 128
temperature: 0.7
top_p: 0.95
repetition_penalty: 1.05

beta: 0.0
scale_rewards: group
loss_type: dapo
mask_truncated_completions: true
reward_type: accuracy_format

use_vllm: false
gradient_checkpointing: true
bf16: true
fp16: false
report_to: none
log_completions: true

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj
