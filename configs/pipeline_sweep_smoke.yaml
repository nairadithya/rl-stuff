models:
  - Qwen/Qwen2.5-0.5B-Instruct
  - google/gemma-3-1b-it

dataset_name: trl-lib/DeepMath-103K
train_split: train
test_split: test
train_max_samples: 200
test_max_samples: 128
max_steps: 10
learning_rate: 1.0e-6
reward_type: length
max_completion_length: 128
eval_max_new_tokens: 128
temperature: 0.7
top_p: 0.95
repetition_penalty: 1.05
mask_truncated_completions: true
num_generations: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
beta: 0.0
num_train_epochs: 1.0
loss_types:
  - grpo
  - dapo

output_root: outputs/smoke_sweep
train_config: configs/grpo_smoke.yaml
eval_config: configs/eval_cpu.yaml
eval_backend: transformers
run_name_prefix: smoke
seed: 42
use_accelerate: true
