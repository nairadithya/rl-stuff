models:
  - Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/DeepMath-103K
train_split: train
test_split: test
train_max_samples: 200
test_max_samples: 50
max_steps: 20
learning_rate: 1.0e-6
reward_type: accuracy_format
max_completion_length: 128
eval_max_new_tokens: 128
temperature: 0.7
top_p: 0.95
repetition_penalty: 1.05
mask_truncated_completions: true
num_generations: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
output_root: outputs/prelim
train_config: configs/grpo_small.yaml
eval_config: configs/eval_prelim.yaml
eval_backend: transformers
eval_fallback_to_transformers: true
run_name_prefix: prelim
seed: 42
skip_training: false
