model_name: Qwen/Qwen2.5-0.5B-Instruct
dataset_name: trl-lib/DeepMath-103K
dataset_split: train
output_dir: /workspace/outputs/grpo-qwen2.5-0.5b
run_name: grpo-modal
seed: 42

num_train_epochs: 1.0
max_steps: -1
learning_rate: 1.0e-6
warmup_steps: 20
warmup_ratio: null

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
num_generations: 4

max_completion_length: 512
temperature: 0.7
top_p: 0.95
repetition_penalty: 1.05

beta: 0.01
scale_rewards: group
loss_type: dapo
mask_truncated_completions: true
reward_type: accuracy_format

use_vllm: true
gradient_checkpointing: true
bf16: true
fp16: false
report_to: wandb
log_completions: true

logging_steps: 5
save_steps: 50
save_total_limit: 2

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - down_proj
  - gate_proj
